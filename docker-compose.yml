# tell docker what version of the docker-compose.yml we're using
version: '3'
# define the network
networks:
  web-network:
# start the services section
services:
  # define the name of our service
  # corresponds to the "--name" parameter
  docker-nginx:
    build: 
      context: ./nginx
    # defines the port mapping
    # corresponds to the "-p" flag
    ports:
      #Vue
      - "5173:5173"
      - "8085:8085"
      # Web
      - "8080:8080"
      - "8081:8081"
      - "3000:3000"
      - "3001:3001"
      - "80:80"
      # 投等倉
      - "81:81"
      # OM
      - "82:82"
      # 簽呈系統
      - "83:83"
      # API中心
      - "84:84"
      # API中心控制管理後臺
      - "848:848"
      # 財務系統
      - "85:85"
      # 三友電商中介平台
      - "86:86"
      # 購美廉
      - "88:88"
      # 購美廉(新)
      - "888:888"
      # APP(mtel)
      - "89:89"
      # APP OMO
      - "898:898"
      # 包裹
      - "90:90"
      # 新版許願池
      - "91:91"
      # 切出來給人用的ESL
      - "92:92"
      # 萬事屋
      - "93:93"
      # 模板
      - "99:99"
      # 其他應用
      - "2025:2025"
      - "2026:2026"
      - "2027:2027"
      # 錢尼私用
      - "61:61"
      - "1001:1001"
      - "10:10"
    tty: true
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../web:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - web-network
  # PHP 7.4 專用 FPM 
  docker-php-fpm:
    build: 
      context: ./php-fpm
    tty: true
    # 添加 ports 映射
    ports:
      - "6001:6001" 
    volumes:
      - ../web:/var/www
      - ./php-fpm/openssl.cnf:/etc/ssl/openssl.cnf
      - ./php-fpm/php.ini:/usr/local/etc/php/php.ini
    networks:
      - web-network
  # PHP 8.3.12 專用 FPM（與 docker-php-fpm 並行；Nginx 依站台改 fastcgi_pass）
  docker-php8-fpm:
    build:
      context: .
      dockerfile: php8-fpm/Dockerfile
    tty: true
    ports:
      # 主機連除錯埠分開避免與 php-fpm 的 6001 衝突
      - "6002:6001"
    volumes:
      - ../web:/var/www
      - ./php8-fpm/openssl.cnf:/etc/ssl/openssl.cnf
      - ./php8-fpm/php.ini:/usr/local/etc/php/php.ini
    networks:
      - web-network
  docker-mysql:
    build: 
      context: ./mysql
    volumes:
      - ~/mysql-docker-data:/var/lib/mysql
    ports:
      - 3306:3306
    environment:
      TZ: Asia/Taipei
      MYSQL_ROOT_PASSWORD: Aa123456
      MYSQL_DATABASE: mydb
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
  redis:
    image: redis:5.0.5-alpine
    container_name: "redis"
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - web-network
    